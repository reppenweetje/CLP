<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- REPP-mark als favicon voor ALLE projecten (Hofman, Paveri, etc).
         Per-project logos zitten in project.logo voor in-app gebruik —
         de tab-icon hoort generiek REPP-brand te zijn want dat is de
         organisatie achter alle CLP's. -->
    <link rel="icon" type="image/svg+xml" href="/images/repp-mark.svg" />
    <!-- maximum-scale en user-scalable bewust niet meer geblokkeerd: gebruikers
         met "Larger Text" of leesproblemen moeten kunnen pinch-to-zoom of de
         Safari Aa-toggle gebruiken. maximum-scale=5 is veilig voor de meeste
         use cases en blokkeert geen accessibility-tooling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f1" />

    <!-- Generieke default — runtime in App.jsx overschrijft document.title
         per project (zie useEffect met project.displayName). Wordt zichtbaar
         als tab-titel voordat React hydrate't en voor browsers/crawlers die
         geen JS draaien. -->
    <title>REPP, brochure en prijzen</title>
    <meta name="description" content="Hoogwaardige bedrijfsunits in Nederland. Bekijk plattegronden, prijzen en actuele beschikbaarheid via REPP." />

    <!-- OG-tags blijven nu nog generiek REPP. Per-project varianten vereisen
         build-time HTML-injectie of Vercel rewrite rules — pas op als
         Facebook/LinkedIn-unfurls per subdomein moeten verschillen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="REPP" />
    <meta property="og:title" content="REPP, brochure en prijzen" />
    <meta property="og:description" content="Hoogwaardige bedrijfsunits in Nederland. Bekijk plattegronden, prijzen en actuele beschikbaarheid via REPP." />
    <meta property="og:locale" content="nl_NL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REPP, brochure en prijzen" />
    <meta name="twitter:description" content="Hoogwaardige bedrijfsunits in Nederland. Bekijk plattegronden, prijzen en actuele beschikbaarheid via REPP." />
    <meta name="twitter:image" content="https://clp-xi-tan.vercel.app/images/hero.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Privacy-friendly analytics by Plausible.
         Per-project script-URL want elke Plausible-preset bevat een hardcoded
         data-domain. Hostname-loader kiest de juiste script bij elke pageview
         zodat Hofman- en Paveri-traffic in aparte Plausible-sites landen
         (anders mixen ze samen onder de site die in de preset bakte).
         Nieuwe projecten: voeg hostname → script-key toe aan PLAUSIBLE_SCRIPTS
         en registreer 't subdomein als nieuwe site in Plausible dashboard. -->
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
      ;(function() {
        var PLAUSIBLE_SCRIPTS = {
          'dehofman.clp.repp.nl': 'pa-35jm-s2ndmvndK0WIw3UD',
          'depaveri.clp.repp.nl': 'pa-PETFTnFGjqtYeAIxBEcjj',
        }
        // Default fallback voor preview-URLs (clp-*.vercel.app), localhost en
        // onbekende hostnames — landt in de Hofman-site zoals voorheen.
        var host = window.location.hostname
        var key  = PLAUSIBLE_SCRIPTS[host] || 'pa-35jm-s2ndmvndK0WIw3UD'
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://plausible.io/js/' + key + '.js'
        document.head.appendChild(s)
      })()
    </script>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('set', 'autoConfig', false, '2003219213613252');
      fbq('init', '2003219213613252');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body class="bg-canvas text-ink">
    <!-- Meta Pixel noscript fallback (moved to body for HTML5 spec compliance) -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2003219213613252&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
