<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- REPP-mark als favicon voor ALLE projecten (Hofman, Paveri, etc).
         Per-project logos zitten in project.logo voor in-app gebruik —
         de tab-icon hoort generiek REPP-brand te zijn want dat is de
         organisatie achter alle CLP's. -->
    <link rel="icon" type="image/svg+xml" href="/images/repp-mark.svg" />
    <!-- maximum-scale en user-scalable bewust niet meer geblokkeerd: gebruikers
         met "Larger Text" of leesproblemen moeten kunnen pinch-to-zoom of de
         Safari Aa-toggle gebruiken. maximum-scale=5 is veilig voor de meeste
         use cases en blokkeert geen accessibility-tooling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f1" />

    <!-- Generieke default — runtime in App.jsx overschrijft document.title
         per project (zie useEffect met project.displayName). Wordt zichtbaar
         als tab-titel voordat React hydrate't en voor browsers/crawlers die
         geen JS draaien. -->
    <title>REPP</title>
    <meta name="description" content="Een tool van REPP." />

    <!-- OG-tags blijven nu nog generiek REPP. Per-project varianten vereisen
         build-time HTML-injectie of Vercel rewrite rules — pas op als
         Facebook/LinkedIn-unfurls per subdomein moeten verschillen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="REPP" />
    <meta property="og:title" content="REPP" />
    <meta property="og:description" content="Een tool van REPP." />
    <meta property="og:locale" content="nl_NL" />
    <!-- REPP-branded OG-image (1200x630px). Per-project images zouden vereisen
         dat we de OG-tags runtime injecteren of via Vercel-edge function
         rewriten; voor nu één generieke REPP-brand-card die voor alle CLP-
         subdomeinen (dehofman/paveri/elster/pier14) hetzelfde preview geeft
         bij Slack/LinkedIn/WhatsApp/Facebook unfurls. -->
    <meta property="og:image" content="https://clp-xi-tan.vercel.app/images/repp-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REPP" />
    <meta name="twitter:description" content="Een tool van REPP." />
    <meta name="twitter:image" content="https://clp-xi-tan.vercel.app/images/repp-og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Prefill-token afvangen en DIRECT uit de URL halen.
         Staat bewust vóór Plausible en de Meta Pixel: die vuren allebei een
         pageview met de huidige URL, dus als het token er dan nog in staat
         lekt het naar analytics. Hier stoppen we 'm in een JS-variabele en
         vervangen we de history-entry, zodat het token ook niet in de
         browsergeschiedenis, bookmarks of Referer-headers belandt.
         App.jsx leest 'm uit window.__clpPrefillToken. -->
    <script>
      (function () {
        try {
          var u = new URL(window.location.href)
          var t = u.searchParams.get('t')
          if (!t) return
          window.__clpPrefillToken = t
          u.searchParams.delete('t')
          window.history.replaceState(null, '', u.pathname + (u.search || '') + (u.hash || ''))
        } catch (e) { /* stil falen: zonder strip gewoon doorladen */ }
      })()
    </script>

    <!-- Privacy-friendly analytics by Plausible.
         Per-project script-URL want elke Plausible-preset bevat een hardcoded
         data-domain. Hostname-loader kiest de juiste script bij elke pageview
         zodat Hofman- en Paveri-traffic in aparte Plausible-sites landen
         (anders mixen ze samen onder de site die in de preset bakte).
         Nieuwe projecten: voeg hostname → script-key toe aan PLAUSIBLE_SCRIPTS
         en registreer 't subdomein als nieuwe site in Plausible dashboard. -->
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
      ;(function() {
        var PLAUSIBLE_SCRIPTS = {
          'dehofman.clp.repp.nl': 'pa-35jm-s2ndmvndK0WIw3UD',
          'depaveri.clp.repp.nl': 'pa-PETFTnFGjqtYeAIxBEcjj',
          'elster11.clp.repp.nl': 'pa-NFnYHbOqOx696UCmYzIrH',
          'pier14.clp.repp.nl':   'pa-TtoOQe3kdszOf60pkOrlq',
          'breda.clp.repp.nl':    'pa-Htah6dy6AnCQT9ro0uSLW',
          '2emwh.clp.repp.nl':          'pa-46w7ptV8uLOpmGt-bT1nR',
          '2emerwedehaven.clp.repp.nl': 'pa-rKpdXg-jEEkS78Yiik7YR',
        }
        // Default fallback voor preview-URLs (clp-*.vercel.app), localhost en
        // onbekende hostnames — landt in de Hofman-site zoals voorheen.
        var host = window.location.hostname
        var key  = PLAUSIBLE_SCRIPTS[host] || 'pa-35jm-s2ndmvndK0WIw3UD'
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://plausible.io/js/' + key + '.js'
        document.head.appendChild(s)
      })()
    </script>

    <!-- Meta Pixel Code
         Alleen op domeinen waar ook advertenties naartoe lopen. Pagina's die
         puur vanuit de mail worden bezocht (bv. de warme 2e Merwedehaven-CLP)
         staan in GEEN_PIXEL: daar valt niets te optimaliseren, en dan hoort het
         gedrag van bekende CRM-contacten ook niet naar Meta te gaan.
         App.jsx controleert zelf op window.fbq, dus zonder pixel worden alle
         Meta-events vanzelf stille no-ops. -->
    <script>
      (function () {
        var GEEN_PIXEL = ['2emerwedehaven.clp.repp.nl']
        try {
          if (GEEN_PIXEL.indexOf(window.location.hostname) !== -1) return
        } catch (e) { /* bij twijfel: gewoon laden */ }
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('set', 'autoConfig', false, '2003219213613252');
        fbq('init', '2003219213613252');
        fbq('track', 'PageView');
      })()
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body class="bg-canvas text-ink">
    <!-- Bewust geen noscript-pixel meer. De CLP is een JS-app: zonder JavaScript
         is er niets te zien en dus ook niets te meten. Zo'n vaste img-tag valt
         bovendien niet per domein uit te zetten, waardoor 'ie alsnog zou vuren
         op pagina's waar we juist geen Meta-tracking willen. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
